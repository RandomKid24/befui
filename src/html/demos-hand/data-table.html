<bef-data-table id="dt" class="w-full" selectable column-menu :page-size="6" filter-placeholder="Filter people"></bef-data-table>
<script>
  const people = [
    ['Aarav Mehta', 'Engineering', 'Pune', '2021-03-15', 1850000, 'Active'], ['Diya Rao', 'Design', 'Bengaluru', '2022-07-01', 1420000, 'On leave'],
    ['Rohan Das', 'Sales', 'Mumbai', '2023-01-09', 960000, 'Active'], ['Isha Nair', 'People Ops', 'Kochi', '2020-11-23', 1100000, 'Active'],
    ['Kabir Shah', 'Engineering', 'Ahmedabad', '2019-05-06', 2250000, 'Notice'], ['Meera Iyer', 'Finance', 'Chennai', '2022-02-14', 1380000, 'Active'],
    ['Vikram Joshi', 'Sales', 'Nashik', '2023-08-21', 880000, 'Active'], ['Ananya Kulkarni', 'Engineering', 'Pune', '2024-01-08', 1620000, 'Active'],
  ].map(([name, team, city, joined, salary, status], i) => ({ id: String(i + 1), name, email: name.toLowerCase().replace(' ', '.') + '@acme.in', team, city, joined, salary, status }));
  const tone = { Active: 'success', 'On leave': 'warning', Notice: 'danger' };
  const date = (d) => new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('dt').props = {
    rows: people, rowKey: (p) => p.id,
    // render functions can return HTML strings with bef-* tags
    columns: [
      { key: 'name', header: 'Name', sortable: true, value: (p) => p.name, render: (p) => `<span class="flex items-center gap-2 whitespace-nowrap"><bef-avatar name="${p.name}" size="sm"></bef-avatar>${p.name}</span>` },
      { key: 'email', header: 'Email', value: (p) => p.email, render: (p) => `<span class="text-muted-foreground">${p.email}</span>` },
      { key: 'team', header: 'Team', sortable: true, value: (p) => p.team },
      { key: 'joined', header: 'Joined', sortable: true, value: (p) => p.joined, render: (p) => `<span class="whitespace-nowrap text-muted-foreground">${date(p.joined)}</span>` },
      { key: 'salary', header: 'Salary', sortable: true, align: 'right', value: (p) => p.salary, render: (p) => '₹' + (p.salary / 100000).toFixed(1) + 'L' },
      { key: 'status', header: 'Status', value: (p) => p.status, render: (p) => `<bef-badge variant="${tone[p.status]}" dot>${p.status}</bef-badge>` },
    ],
    bulkActions: (rows, clear) => `<bef-button size="xs" variant="outline">Export ${rows.length}</bef-button><bef-button size="xs" variant="ghost">Clear</bef-button>`,
  };
</script>
