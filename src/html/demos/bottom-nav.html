<div style="width:300px;height:260px;display:grid;grid-template-rows:1fr auto;border:4px solid var(--foreground);border-radius:28px;overflow:hidden;background:var(--background)">
  <div id="bn-label" style="display:grid;place-items:center;font-size:14px">home</div>
  <bef-bottom-nav id="bn" value="home" emit="value-change" :items='[
    {"id":"home","label":"Home","icon":"<bef-home-icon></bef-home-icon>"},
    {"id":"search","label":"Search","icon":"<bef-search-icon></bef-search-icon>"},
    {"id":"alerts","label":"Alerts","icon":"<bef-bell-icon></bef-bell-icon>","badge":3},
    {"id":"me","label":"Profile","icon":"<bef-user-icon></bef-user-icon>"}]'></bef-bottom-nav>
</div>
<script>
  const bn = document.getElementById('bn');
  bn.addEventListener('bef:value-change', (e) => { bn.setAttribute('value', e.detail); document.getElementById('bn-label').textContent = e.detail; });
</script>
