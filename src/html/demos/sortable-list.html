<div class="grid w-full max-w-md gap-2" style="width:100%;max-width:28rem;display:grid;gap:8px">
  <bef-sortable-list id="sl2"></bef-sortable-list>
  <p style="padding:0 4px;font-size:12px;color:var(--muted-foreground);margin:0">Drag a row, or Tab to a grip and press the up and down arrows.</p>
</div>
<script>
  const sl2 = document.getElementById('sl2');
  const draw = (items) => sl2.props = {
    items, onChange: draw,
    renderItem: (s, i) => `<div class="flex items-center gap-2"><span class="w-4 text-xs tabular-nums text-muted-foreground">${i + 1}</span>
      <div class="min-w-0 flex-1"><p class="truncate font-medium">${s.title}</p><p class="text-xs text-muted-foreground">${s.owner}</p></div><bef-badge>${s.tag}</bef-badge></div>`,
  };
  draw([
    { id: 'a', title: 'Collect documents', owner: 'Isha Nair', tag: 'HR' }, { id: 'b', title: 'Create email and accounts', owner: 'Rohan Das', tag: 'IT' },
    { id: 'c', title: 'Assign a buddy', owner: 'Aarav Mehta', tag: 'Team' }, { id: 'd', title: 'Schedule day-one orientation', owner: 'Meera Iyer', tag: 'HR' },
    { id: 'e', title: 'Order laptop', owner: 'Vikram Joshi', tag: 'IT' }]);
</script>
