<div class="grid w-full max-w-xl gap-4">
  <dl class="grid gap-1.5 rounded-xl border bg-card p-4 font-mono text-xs">
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatCurrency(1250000)</dt>
      <dd class="shrink-0 font-semibold text-foreground">₹12,50,000</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatCurrency(1250000, { compact: true })</dt>
      <dd class="shrink-0 font-semibold text-foreground">₹12.5L</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatCurrency(4999.5, { currency: &quot;USD&quot;, locale: &quot;en-US&quot; })</dt>
      <dd class="shrink-0 font-semibold text-foreground">$4,999.50</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatCompact(48200)</dt>
      <dd class="shrink-0 font-semibold text-foreground">48.2K</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatPercent(0.1234)</dt>
      <dd class="shrink-0 font-semibold text-foreground">12.3%</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatBytes(1536000)</dt>
      <dd class="shrink-0 font-semibold text-foreground">1.5 MB</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="truncate text-muted-foreground">formatDuration(3725)</dt>
      <dd class="shrink-0 font-semibold text-foreground">1h 2m</dd>
    </div>
  </dl>
  <p class="flex gap-4 text-sm">Net change: <bef-currency :value="42500" signed></bef-currency> <bef-currency :value="-18200" signed></bef-currency></p>
</div>
