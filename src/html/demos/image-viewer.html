<div style="display:grid;grid-template-columns:repeat(4,6rem);gap:8px" id="iv-row"></div>
<bef-image-viewer id="iv"></bef-image-viewer>
<script>
  const art = (bg, fg, label) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="${bg}"/><circle cx="820" cy="300" r="190" fill="${fg}" opacity=".85"/><rect x="180" y="420" width="520" height="220" rx="24" fill="${fg}" opacity=".55"/><text x="60" y="110" font-family="sans-serif" font-size="56" fill="${fg}">${label}</text></svg>`);
  const images = [
    { src: art('#e0e7ff', '#4338ca', 'Office floor plan'), alt: 'Office floor plan' }, { src: art('#fce7f3', '#be185d', 'Brand moodboard'), alt: 'Brand moodboard' },
    { src: art('#dcfce7', '#15803d', 'Event photos'), alt: 'Event photos' }, { src: art('#fef3c7', '#b45309', 'Product shots'), alt: 'Product shots' }];
  const iv = document.getElementById('iv');
  const show = (index) => iv.props = { images, index, onIndexChange: show };
  show(null);
  images.forEach((im, i) => {
    const b = document.createElement('button'); b.type = 'button';
    b.style.cssText = 'aspect-ratio:1;width:6rem;overflow:hidden;border-radius:8px;border:1px solid var(--border);padding:0;cursor:pointer';
    b.innerHTML = `<img src="${im.src}" alt="${im.alt}" style="width:100%;height:100%;object-fit:cover">`;
    b.onclick = () => show(i); document.getElementById('iv-row').append(b);
  });
</script>
