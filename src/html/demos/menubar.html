<div class="flex min-h-64 w-full justify-center">
  <bef-menubar>
    <bef-menubar-menu>
      <bef-menubar-trigger>File</bef-menubar-trigger>
      <bef-menubar-content>
        <bef-menubar-item>New file <bef-menubar-shortcut>⌘N</bef-menubar-shortcut></bef-menubar-item>
        <bef-menubar-item>Open <bef-menubar-shortcut>⌘O</bef-menubar-shortcut></bef-menubar-item>
        <bef-menubar-separator></bef-menubar-separator>
        <bef-menubar-checkbox-item :checked="false" emit="checked-change">Autosave</bef-menubar-checkbox-item>
        <bef-menubar-separator></bef-menubar-separator>
        <bef-menubar-item destructive>Delete project</bef-menubar-item>
      </bef-menubar-content>
    </bef-menubar-menu>
    <bef-menubar-menu>
      <bef-menubar-trigger>Edit</bef-menubar-trigger>
      <bef-menubar-content>
        <bef-menubar-item>Undo <bef-menubar-shortcut>⌘Z</bef-menubar-shortcut></bef-menubar-item>
        <bef-menubar-item>Redo <bef-menubar-shortcut>⇧⌘Z</bef-menubar-shortcut></bef-menubar-item>
      </bef-menubar-content>
    </bef-menubar-menu>
    <bef-menubar-menu>
      <bef-menubar-trigger>View</bef-menubar-trigger>
      <bef-menubar-content>
        <bef-menubar-checkbox-item checked emit="checked-change">Show grid</bef-menubar-checkbox-item>
        <bef-menubar-item>Zoom in <bef-menubar-shortcut>⌘+</bef-menubar-shortcut></bef-menubar-item>
      </bef-menubar-content>
    </bef-menubar-menu>
  </bef-menubar>
</div>
