    <script>
      try {
        var q = new URLSearchParams(location.search).get('theme'); // ?theme=dark|light overrides, without saving
        var t = q || localStorage.getItem('befui-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
